<!doctype html>
<!-- Asset source, not shipped: open via `npm run dev` at /tools/og.html?w=1200&h=630 (og image), ?w=1280&h=720 (video
     poster) or ?icon=512 (icon); tools/assets.sh screenshots it with headless Chrome. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tayli asset</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
      .og {
        position: relative;
        background-image: radial-gradient(
          closest-side at 28% 50%,
          oklch(0.64 0.17 248 / 0.22),
          transparent
        ) !important;
        display: flex;
        align-items: center;
        gap: 40px;
        padding: 0 80px;
        background: var(--ground);
        overflow: hidden;
      }
      .og canvas {
        flex: none;
      }
      .og h1 {
        font-size: 120px;
        margin: 0;
      }
      .og p {
        font-size: 34px;
        line-height: 1.3;
        color: var(--muted);
        margin: 10px 0 0;
      }
      .og.icon {
        padding: 0;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="og" id="box">
      <canvas id="c"></canvas>
      <div id="text">
        <h1>Tayli</h1>
        <p>Talk to your Mac. Tayli gets it done.</p>
      </div>
    </div>
    <script type="module">
      import { Swarm } from "/src/swarm.ts";
      const q = new URLSearchParams(location.search);
      const icon = Number(q.get("icon") || 0);
      const w = icon || Number(q.get("w")),
        h = icon || Number(q.get("h"));
      const box = document.getElementById("box"),
        c = document.getElementById("c");
      Object.assign(box.style, { width: w + "px", height: h + "px" });
      const size = icon ? icon * 2.3 : h * 0.95;
      Object.assign(c.style, {
        width: size + "px",
        height: size + "px",
        margin: icon ? -icon * 0.65 + "px" : "0",
      });
      if (icon) {
        box.classList.add("icon");
        document.getElementById("text").remove();
      }
      const s = new Swarm(c, c.getContext("2d"));
      for (let i = 0; i < 240; i++)
        s.frame(1 / 60, "ready", { user: 0, bot: 0 }, false);
    </script>
  </body>
</html>
